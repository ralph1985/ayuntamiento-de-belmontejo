name: Fetch bandos and open PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-bandos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.25.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fetch latest bandos
        run: pnpm run fetch-bandos

      - name: Open pull request with changes
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        env:
          SKIP_VERSION_CHECK: 1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/fetch-bandos
          base: main
          title: 'chore: actualizar bandos'
          commit-message: 'chore: actualizar bandos'
          body: |
            ## Actualizacion automatica de bandos

            - Script ejecutado: `pnpm run fetch-bandos`
            - Formateo aplicado solo a los bandos generados
            - Base: `main`

            _Si los cambios son correctos, aprueba y haz merge de esta PR._
          delete-branch: true
