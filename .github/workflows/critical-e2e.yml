name: Critical E2E (production)

on:
  push:
    branches: [main]

jobs:
  run-critical-e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.12'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for production deployment
        run: |
          url="https://ayuntamiento-de-belmontejo.vercel.app/"
          for attempt in {1..10}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$status" = "200" ]; then
              echo "Deployment is reachable (HTTP $status)."
              exit 0
            fi
            echo "Attempt $attempt: deployment not ready (HTTP $status). Retrying in 15s..."
            sleep 15
          done
          echo "Deployment did not become ready in time" >&2
          exit 1

      - name: Warm up critical pages
        run: |
          base="https://ayuntamiento-de-belmontejo.vercel.app"
          for path in "/" "/proyectos/proyecto-1" "/proyectos/proyecto-2" "/buscar"; do
            echo "Warming $base$path"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" "$base$path"
          done

      - name: Run functional E2E tests with deterministic fixtures
        env:
          ASTRO_DEV_BACKGROUND: '0'
        run: pnpm run test:e2e -- tests/e2e/specs/flows

      - name: Verify critical production routes
        env:
          PLAYWRIGHT_BASE_URL: https://ayuntamiento-de-belmontejo.vercel.app
        run: |
          for path in / /noticias /bandos /sobre-el-pueblo /buscar; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$PLAYWRIGHT_BASE_URL$path")
            if [ "$status" != "200" ]; then
              echo "Production route $path returned HTTP $status" >&2
              exit 1
            fi
            echo "Production route $path returned HTTP $status"
          done
