# GitHub backend configuration for Vercel deployment
backend:
  name: github
  repo: ralph1985/ayuntamiento-de-belmontejo
  branch: main
  site_domain: ayuntamiento-de-belmontejo.vercel.app
  base_url: https://ayuntamiento-de-belmontejo.vercel.app
  auth_endpoint: oauth

# Enable editorial workflow for content approval process
publish_mode: editorial_workflow

local_backend: true

# Configurar idioma español
locale: 'es'

# Logo for Decap login page. Change url to a link to the image you want to use, no file paths, must be a URL
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site link in DecapCMS (optional)
site_url: https://ayuntamiento-de-belmontejo.vercel.app

media_folder: src/assets/images # Location where files will be stored in the repo - we store them in src so that Astro can optimize them.
public_folder: src/assets/images # Ensure that this path is the same as the media_folder path above.

# Quickly see who did what (optional)
commit_messages:
  create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
  update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
  delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
  uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}>
  deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}>
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}>

collections:
  - name: 'noticias' # Used in routes, e.g., /admin/collections/noticias. Is also the key when fetching data from the CMS.
    label: 'Noticias' # Used in the admin dashboard UI
    folder: 'src/content/noticias' # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    media_folder: 'src/assets/images/noticias' # Folder específico para imágenes de noticias
    public_folder: 'src/assets/images/noticias' # Ruta pública para imágenes de noticias
    fields: # The fields for each document
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Descripción', name: 'description', widget: 'string' }
      - { label: 'Autor', name: 'author', widget: 'string' }
      - { label: 'Fecha', name: 'date', widget: 'datetime' }
      - { label: 'Imagen de portada', name: 'image', widget: 'image' }
      - {
          label: 'Descripción de la imagen',
          name: 'imageAlt',
          widget: 'string',
        }
      - {
          label: '¿Es una noticia destacada?',
          name: 'isFeatured',
          widget: 'boolean',
          default: false,
        }
      - { label: 'Contenido', name: 'body', widget: 'markdown' }

  - name: 'bandos' # Used in routes, e.g., /admin/collections/bandos
    label: 'Bandos' # Used in the admin dashboard UI
    folder: 'src/content/bandos' # The path to the folder where the bandos are stored
    create: true # Allow users to create new bandos in this collection
    media_folder: 'src/assets/images/bandos' # Folder específico para imágenes de bandos
    public_folder: 'src/assets/images/bandos' # Ruta pública para imágenes de bandos
    fields: # The fields for each bando document
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Descripción', name: 'description', widget: 'text' }
      - {
          label: 'Autor',
          name: 'author',
          widget: 'string',
          default: 'Ayuntamiento de Belmontejo',
        }
      - { label: 'Fecha', name: 'date', widget: 'datetime' }
      - {
          label: 'Imagen (opcional)',
          name: 'image',
          widget: 'image',
          required: false,
        }
      - {
          label: 'Descripción de la imagen',
          name: 'imageAlt',
          widget: 'string',
          required: false,
        }
      - {
          label: 'Categoría',
          name: 'category',
          widget: 'string',
          default: 'Info General',
        }
      - {
          label: 'GUID',
          name: 'guid',
          widget: 'string',
          hint: 'Identificador único del bando (se genera automáticamente al sincronizar)',
        }
      - {
          label: 'Enlace original',
          name: 'link',
          widget: 'string',
          hint: 'URL del bando original en Bandomovil',
        }
      - {
          label: '¿Es un bando destacado?',
          name: 'isFeatured',
          widget: 'boolean',
          default: false,
        }
      - { label: 'Contenido', name: 'body', widget: 'markdown' }

  - name: 'faqs'
    label: 'Preguntas frecuentes'
    folder: 'src/content/faqs'
    create: true
    fields:
      - { label: 'Pregunta', name: 'question', widget: 'string' }
      - { label: 'Orden', name: 'order', widget: 'number', default: 0 }
      - {
          label: '¿Mostrar abierta por defecto?',
          name: 'isDefaultOpen',
          widget: 'boolean',
          default: false,
        }
      - { label: 'Respuesta', name: 'body', widget: 'markdown' }

  - name: 'site-data'
    label: 'Contenido fijo'
    files:
      - label: 'Datos de contacto'
        name: 'contact-info'
        file: 'src/data/contact-info.json'
        fields:
          - label: 'Entidad'
            name: 'entity'
            widget: 'object'
            fields:
              - { label: 'Nombre', name: 'name', widget: 'string' }
              - { label: 'Dominio', name: 'domain', widget: 'string' }
          - label: 'Canales de contacto'
            name: 'contact'
            widget: 'object'
            fields:
              - label: 'Teléfonos'
                name: 'phones'
                widget: 'list'
                summary: '{{fields.label}} — {{fields.display}}'
                fields:
                  - { label: 'ID', name: 'id', widget: 'string' }
                  - { label: 'Etiqueta', name: 'label', widget: 'string' }
                  - {
                      label: 'Número mostrado',
                      name: 'display',
                      widget: 'string',
                    }
                  - {
                      label: 'Número para enlace (tel)',
                      name: 'href',
                      widget: 'string',
                    }
                  - {
                      label: '¿Es el principal?',
                      name: 'isPrimary',
                      widget: 'boolean',
                      default: false,
                    }
                  - {
                      label: 'Notas',
                      name: 'notes',
                      widget: 'text',
                      required: false,
                    }
              - label: 'Correos electrónicos'
                name: 'emails'
                widget: 'list'
                summary: '{{fields.label}} — {{fields.address}}'
                fields:
                  - { label: 'ID', name: 'id', widget: 'string' }
                  - { label: 'Etiqueta', name: 'label', widget: 'string' }
                  - {
                      label: 'Correo electrónico',
                      name: 'address',
                      widget: 'string',
                    }
                  - {
                      label: '¿Es el principal?',
                      name: 'isPrimary',
                      widget: 'boolean',
                      default: false,
                    }
                  - {
                      label: 'Notas',
                      name: 'notes',
                      widget: 'text',
                      required: false,
                    }
          - label: 'Oficinas y direcciones'
            name: 'offices'
            widget: 'list'
            summary: '{{fields.label}} — {{fields.locality}}'
            fields:
              - { label: 'ID', name: 'id', widget: 'string' }
              - { label: 'Etiqueta', name: 'label', widget: 'string' }
              - { label: 'Calle', name: 'street', widget: 'string' }
              - { label: 'Localidad', name: 'locality', widget: 'string' }
              - {
                  label: 'Provincia / Región',
                  name: 'region',
                  widget: 'string',
                  required: false,
                }
              - {
                  label: 'Código postal',
                  name: 'postalCode',
                  widget: 'string',
                  required: false,
                }
              - {
                  label: 'Enlace a mapa',
                  name: 'mapsUrl',
                  widget: 'string',
                  required: false,
                }
              - {
                  label: '¿Es la sede principal?',
                  name: 'isPrimary',
                  widget: 'boolean',
                  default: false,
                }
          - label: 'Redes sociales'
            name: 'social'
            widget: 'object'
            fields:
              - label: 'Facebook'
                name: 'facebook'
                widget: 'object'
                fields:
                  - { label: 'Nombre visible', name: 'label', widget: 'string' }
                  - { label: 'URL', name: 'url', widget: 'string' }
                  - {
                      label: '¿Mostrar en la web?',
                      name: 'isActive',
                      widget: 'boolean',
                      default: true,
                    }
              - label: 'Instagram'
                name: 'instagram'
                widget: 'object'
                fields:
                  - { label: 'Nombre visible', name: 'label', widget: 'string' }
                  - { label: 'URL', name: 'url', widget: 'string' }
                  - {
                      label: '¿Mostrar en la web?',
                      name: 'isActive',
                      widget: 'boolean',
                      default: true,
                    }
      - label: 'Enlaces de servicios'
        name: 'footer-services'
        file: 'src/data/footerServices.json'
        fields:
          - label: 'Enlaces de Servicios'
            name: 'services'
            widget: 'list'
            summary: '{{fields.title}} - {{fields.isActive}}'
            fields:
              - { label: 'ID', name: 'id', widget: 'number', min: 1 }
              - { label: 'Título del enlace', name: 'title', widget: 'string' }
              - {
                  label: 'URL',
                  name: 'url',
                  widget: 'string',
                  required: false,
                  hint: 'Deja vacío si el enlace aún no tiene destino',
                }
              - {
                  label: '¿Es enlace externo?',
                  name: 'isExternal',
                  widget: 'boolean',
                  default: false,
                  hint: 'Marca esta opción si el enlace lleva a un sitio web externo',
                }
              - {
                  label: '¿Está activo?',
                  name: 'isActive',
                  widget: 'boolean',
                  default: false,
                  hint: 'Solo los enlaces activos aparecerán como enlaces clicables en el footer',
                }

  - name: 'projects'
    label: 'Proyectos'
    files:
      - label: 'Proyectos municipales'
        name: 'projects'
        file: 'src/data/projects.json'
        media_folder: 'public/assets/images/proyectos'
        public_folder: '/assets/images/proyectos'
        fields:
          - label: 'Proyectos'
            name: 'projects'
            widget: 'list'
            summary: '{{fields.title}}'
            fields:
              - {
                  label: 'Slug de la URL',
                  name: 'slug',
                  widget: 'string',
                  hint: 'No lo cambies si quieres conservar los enlaces actuales.',
                }
              - { label: 'Número', name: 'number', widget: 'string' }
              - { label: 'Título', name: 'title', widget: 'string' }
              - {
                  label: 'Descripción SEO',
                  name: 'pageDescription',
                  widget: 'text',
                }
              - { label: 'Introducción', name: 'landingIntro', widget: 'text' }
              - { label: 'Resumen', name: 'summary', widget: 'text' }
              - { label: 'Etiqueta', name: 'eyebrow', widget: 'string' }
              - {
                  label: 'Título del detalle',
                  name: 'detailTitle',
                  widget: 'string',
                }
              - {
                  label: 'Descripción del detalle',
                  name: 'detailDescription',
                  widget: 'text',
                }
              - { label: 'Imagen', name: 'imageSrc', widget: 'image' }
              - {
                  label: 'Descripción de la imagen',
                  name: 'imageAlt',
                  widget: 'string',
                }
              - label: 'Datos destacados'
                name: 'facts'
                widget: 'list'
                summary: '{{fields.label}}'
                fields:
                  - { label: 'Etiqueta', name: 'label', widget: 'string' }
                  - { label: 'Valor', name: 'value', widget: 'string' }
              - {
                  label: 'Enlace de la fuente',
                  name: 'sourceHref',
                  widget: 'string',
                }
              - {
                  label: 'Texto del enlace',
                  name: 'sourceLabel',
                  widget: 'string',
                }

  - name: 'about-village'
    label: 'Sobre el pueblo'
    files:
      - label: 'Contenido de Sobre el pueblo'
        name: 'about-village'
        file: 'src/data/aboutVillage.json'
        media_folder: 'public/assets/images/sobre-el-pueblo'
        public_folder: '/assets/images/sobre-el-pueblo'
        fields:
          - { label: 'Título SEO', name: 'pageTitle', widget: 'string' }
          - {
              label: 'Descripción SEO',
              name: 'pageDescription',
              widget: 'text',
            }
          - {
              label: 'Título de portada',
              name: 'landingTitle',
              widget: 'string',
            }
          - {
              label: 'Introducción de portada',
              name: 'landingIntro',
              widget: 'text',
            }
          - {
              label: 'Etiqueta de ubicación',
              name: 'overviewEyebrow',
              widget: 'string',
            }
          - {
              label: 'Título de ubicación',
              name: 'overviewTitle',
              widget: 'string',
            }
          - {
              label: 'Descripción general',
              name: 'overviewDescription',
              widget: 'text',
            }
          - {
              label: 'Título de historia',
              name: 'historyTitle',
              widget: 'string',
            }
          - label: 'Párrafos de historia'
            name: 'historyParagraphs'
            widget: 'list'
            field: { label: 'Párrafo', widget: 'text' }
          - label: 'Imágenes de ubicación'
            name: 'overviewImages'
            widget: 'list'
            min: 2
            max: 2
            summary: '{{fields.alt}}'
            fields:
              - {
                  label: 'Imagen escritorio',
                  name: 'desktopSrc',
                  widget: 'image',
                }
              - { label: 'Imagen móvil', name: 'mobileSrc', widget: 'image' }
              - { label: 'Texto alternativo', name: 'alt', widget: 'string' }
          - { label: 'Cita', name: 'quote', widget: 'text' }
          - { label: 'Autor de la cita', name: 'quoteAuthor', widget: 'string' }
          - { label: 'Cargo o lugar', name: 'quoteRole', widget: 'string' }
          - {
              label: 'Etiqueta del vídeo',
              name: 'videoEyebrow',
              widget: 'string',
            }
          - { label: 'Título del vídeo', name: 'videoTitle', widget: 'string' }
          - {
              label: 'Descripción del vídeo',
              name: 'videoDescription',
              widget: 'text',
            }
          - { label: 'URL del vídeo', name: 'videoUrl', widget: 'string' }
          - {
              label: 'Título accesible del vídeo',
              name: 'videoTitleAttribute',
              widget: 'string',
            }
          - {
              label: 'Etiqueta del mapa',
              name: 'mapSubtitle',
              widget: 'string',
            }
          - { label: 'Título del mapa', name: 'mapTitle', widget: 'string' }
          - {
              label: 'Descripción del mapa',
              name: 'mapDescription',
              widget: 'text',
            }
